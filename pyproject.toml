[project]
name = "pead-bot"
version = "0.1.0"
description = "Bot de alertas (solo simulación) de deriva post-resultados"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "anthropic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pead-bot = "pead_bot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
